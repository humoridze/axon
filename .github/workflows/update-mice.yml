name: Update mice

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenRazer
        run: |
          mkdir -p tools/openrazer
          curl -fsSL -o tools/openrazer/mouse.py https://raw.githubusercontent.com/openrazer/openrazer/master/daemon/openrazer_daemon/hardware/mouse.py
          curl -fsSL -o tools/openrazer/razermouse_driver.c https://raw.githubusercontent.com/openrazer/openrazer/master/driver/razermouse_driver.c
          curl -fsSL -o tools/razermouse_driver.h https://raw.githubusercontent.com/openrazer/openrazer/master/driver/razermouse_driver.h
      - name: Generate new profiles
        run: node tools/generate-devices.mjs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/devices README.md tools/razermouse_driver.h
          if git diff --cached --quiet; then
            echo 'No new mice'
            exit 0
          fi
          git commit -m "Add new mice from OpenRazer"
          git push
